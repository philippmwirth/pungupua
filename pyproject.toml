[project]
name = "bao"
version = "0.1.0"
description = "Bao la Kiswahili for JAX-based game tree search"
authors = [
    { name = "philippmwirth", email = "philipp.m.wirth@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jax>=0.10.0",
    "jaxlib>=0.10.0",
    "pgx>=2.6.0",
]

[build-system]
requires = ["uv_build>=0.8.8,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
