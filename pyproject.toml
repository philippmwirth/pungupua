[project]
name = "bao"
version = "0.1.0"
description = "Bao la Kiswahili for JAX-based game tree search"
authors = [
    { name = "philippmwirth", email = "philipp.m.wirth@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jax>=0.10.0",
    "jaxlib>=0.10.0",
    "pgx>=2.6.0",
    "mctx>=0.0.5",
    "dm-haiku>=0.0.12",
    "optax>=0.2.0",
    "omegaconf>=2.3.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
wandb = ["wandb>=0.16.0"]

[build-system]
requires = ["uv_build>=0.8.8,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
